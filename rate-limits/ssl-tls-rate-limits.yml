specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SSL/TLS
providerId: ssl-tls
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - SSL/TLS
  - TLS
  - Certificates
  - PKI
  - Certificate Authority
  - Rate Limiting
description: Multi-vendor category covering ACME and CA-issuance APIs. Let's Encrypt publishes concrete per-account, per-IP, and per-domain limits on the ACME v2 endpoint; DigiCert and Sectigo gate API throughput per partner contract and do not publish numeric per-second limits. Numbers below are sourced from Let's Encrypt's public rate-limit documentation.
sources:
  - https://letsencrypt.org/docs/rate-limits/
  - https://dev.digicert.com/services-api/
  - https://sectigo.com/resource-library/cert-manager-api-documentation
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  rateLimited: 429
limits:
  - name: Let's Encrypt - Certificates per Registered Domain
    scope: registered-domain
    metric: certificates
    limit: 50
    timeFrame: week
    notes: 'Refills at 1 certificate per 202 minutes. Override available via Let''s Encrypt rate-limit override form.'
  - name: Let's Encrypt - Duplicate Certificates
    scope: identifier-set
    metric: certificates
    limit: 5
    timeFrame: week
    notes: Same exact set of identifiers; refills at 1 certificate per 34 hours.
  - name: Let's Encrypt - New Accounts per IP
    scope: IP
    metric: accounts
    limit: 10
    timeFrame: 3h
    notes: Refills at 1 account per 18 minutes. No overrides available.
  - name: Let's Encrypt - New Orders per Account
    scope: account
    metric: orders
    limit: 300
    timeFrame: 3h
    notes: Refills at 1 order per 36 seconds. Overrides available upon request.
  - name: Let's Encrypt - Failed Validations per Account per Identifier
    scope: account/identifier
    metric: failures
    limit: 5
    timeFrame: hour
    notes: Refills at 1 per identifier every 12 minutes. No overrides available.
  - name: DigiCert Services API
    scope: account/contract
    metric: varies
    limit: per partner contract; not publicly documented
    notes: DigiCert gates API throughput through the partner agreement; consult your account team.
  - name: Sectigo Certificate Manager API
    scope: account/contract
    metric: varies
    limit: per partner contract; not publicly documented
    notes: Sectigo enforces throughput per Cert Manager license; consult your account team.
policies:
  - name: ACME Backoff
    description: Let's Encrypt returns 429 with a Retry-After header (sometimes embedded in the error message as 'retry after <UTC time>'); ACME clients (certbot, lego, acme.sh) honor this automatically and retry at the indicated time.
  - name: Staging Environment First
    description: Let's Encrypt strongly recommends developing against the staging endpoint (acme-staging-v02.api.letsencrypt.org) where rate limits are much higher, before pointing automation at production.
  - name: Override by Request
    description: New-orders-per-account and certificates-per-registered-domain caps can be raised via Let's Encrypt's public rate-limit override form for organizations with documented legitimate need. Account-per-IP and failed-validation caps cannot be overridden.
maintainers:
  - name: API Evangelist
    url: https://apievangelist.com
