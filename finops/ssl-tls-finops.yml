principles:
  - name: Visibility
    description: Inventory issued certificates via each CA's portal or API (DigiCert Services API, Sectigo Cert Manager, Let's Encrypt ACME account orders endpoint). Aggregate into a single CMDB / certificate-lifecycle tool to see total spend across CAs.
  - name: Allocation
    description: Allocate per-certificate cost to the team that owns the hostname. Tag certificates with team/product at issuance; for ACME automation, derive ownership from the requesting service principal.
  - name: Optimization
    description: Default to Let's Encrypt for DV use cases (free, fully automated); reserve OV/EV from paid CAs for explicit business-identity requirements. Consolidate wildcard certificates where possible to reduce per-cert charges.
  - name: Accountability
    description: PKI / platform-security team owns the CA contracts and renewal cadence; product teams own remediation when their certificates approach expiry or fail validation.
