naftiko: 1.0.0-alpha2
info:
  label: SSL/TLS Certificate Management API — Certificates
  description: 'SSL/TLS Certificate Management API — Certificates. 5 operations. Lead operation: List Certificates. Self-contained
    Naftiko capability covering one Ssl Tls business surface.'
  tags:
  - Ssl Tls
  - Certificates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SSL_TLS_API_KEY: SSL_TLS_API_KEY
capability:
  consumes:
  - type: http
    namespace: certificate-management-certificates
    baseUri: https://api.certmanager.example.com/v1
    description: SSL/TLS Certificate Management API — Certificates business capability. Self-contained, no shared references.
    resources:
    - name: certificates
      path: /certificates
      operations:
      - name: listcertificates
        method: GET
        description: List Certificates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by certificate status
        - name: domain
          in: query
          type: string
          description: Filter by domain name
        - name: expiringBefore
          in: query
          type: string
          description: Filter certificates expiring before this date (ISO 8601)
        - name: page
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
      - name: requestcertificate
        method: POST
        description: Request Certificate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: certificates-certificateId
      path: /certificates/{certificateId}
      operations:
      - name: getcertificate
        method: GET
        description: Get Certificate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: certificates-certificateId-download
      path: /certificates/{certificateId}/download
      operations:
      - name: downloadcertificate
        method: GET
        description: Download Certificate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: format
          in: query
          type: string
    - name: certificates-certificateId-renew
      path: /certificates/{certificateId}/renew
      operations:
      - name: renewcertificate
        method: POST
        description: Renew Certificate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.SSL_TLS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: certificate-management-certificates-rest
    port: 8080
    description: REST adapter for SSL/TLS Certificate Management API — Certificates. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/certificates
      name: certificates
      description: REST surface for certificates.
      operations:
      - method: GET
        name: listcertificates
        description: List Certificates
        call: certificate-management-certificates.listcertificates
        with:
          status: rest.status
          domain: rest.domain
          expiringBefore: rest.expiringBefore
          page: rest.page
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: requestcertificate
        description: Request Certificate
        call: certificate-management-certificates.requestcertificate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/certificates/{certificateid}
      name: certificates-certificateid
      description: REST surface for certificates-certificateId.
      operations:
      - method: GET
        name: getcertificate
        description: Get Certificate
        call: certificate-management-certificates.getcertificate
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/certificates/{certificateid}/download
      name: certificates-certificateid-download
      description: REST surface for certificates-certificateId-download.
      operations:
      - method: GET
        name: downloadcertificate
        description: Download Certificate
        call: certificate-management-certificates.downloadcertificate
        with:
          format: rest.format
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/certificates/{certificateid}/renew
      name: certificates-certificateid-renew
      description: REST surface for certificates-certificateId-renew.
      operations:
      - method: POST
        name: renewcertificate
        description: Renew Certificate
        call: certificate-management-certificates.renewcertificate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: certificate-management-certificates-mcp
    port: 9090
    transport: http
    description: MCP adapter for SSL/TLS Certificate Management API — Certificates. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-certificates
      description: List Certificates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: certificate-management-certificates.listcertificates
      with:
        status: tools.status
        domain: tools.domain
        expiringBefore: tools.expiringBefore
        page: tools.page
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: request-certificate
      description: Request Certificate
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: certificate-management-certificates.requestcertificate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-certificate
      description: Get Certificate
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: certificate-management-certificates.getcertificate
      outputParameters:
      - type: object
        mapping: $.
    - name: download-certificate
      description: Download Certificate
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: certificate-management-certificates.downloadcertificate
      with:
        format: tools.format
      outputParameters:
      - type: object
        mapping: $.
    - name: renew-certificate
      description: Renew Certificate
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: certificate-management-certificates.renewcertificate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
