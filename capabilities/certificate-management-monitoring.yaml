naftiko: 1.0.0-alpha2
info:
  label: SSL/TLS Certificate Management API — Monitoring
  description: 'SSL/TLS Certificate Management API — Monitoring. 1 operations. Lead operation: Get Expiring Certificates.
    Self-contained Naftiko capability covering one Ssl Tls business surface.'
  tags:
  - Ssl Tls
  - Monitoring
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SSL_TLS_API_KEY: SSL_TLS_API_KEY
capability:
  consumes:
  - type: http
    namespace: certificate-management-monitoring
    baseUri: https://api.certmanager.example.com/v1
    description: SSL/TLS Certificate Management API — Monitoring business capability. Self-contained, no shared references.
    resources:
    - name: monitoring-expiring
      path: /monitoring/expiring
      operations:
      - name: getexpiringcertificates
        method: GET
        description: Get Expiring Certificates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: days
          in: query
          type: integer
          description: Number of days to look ahead for expiring certificates
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.SSL_TLS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: certificate-management-monitoring-rest
    port: 8080
    description: REST adapter for SSL/TLS Certificate Management API — Monitoring. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/monitoring/expiring
      name: monitoring-expiring
      description: REST surface for monitoring-expiring.
      operations:
      - method: GET
        name: getexpiringcertificates
        description: Get Expiring Certificates
        call: certificate-management-monitoring.getexpiringcertificates
        with:
          days: rest.days
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: certificate-management-monitoring-mcp
    port: 9090
    transport: http
    description: MCP adapter for SSL/TLS Certificate Management API — Monitoring. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-expiring-certificates
      description: Get Expiring Certificates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: certificate-management-monitoring.getexpiringcertificates
      with:
        days: tools.days
      outputParameters:
      - type: object
        mapping: $.
