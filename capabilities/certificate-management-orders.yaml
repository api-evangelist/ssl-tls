naftiko: 1.0.0-alpha2
info:
  label: SSL/TLS Certificate Management API — Orders
  description: 'SSL/TLS Certificate Management API — Orders. 2 operations. Lead operation: List Orders. Self-contained Naftiko
    capability covering one Ssl Tls business surface.'
  tags:
  - Ssl Tls
  - Orders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SSL_TLS_API_KEY: SSL_TLS_API_KEY
capability:
  consumes:
  - type: http
    namespace: certificate-management-orders
    baseUri: https://api.certmanager.example.com/v1
    description: SSL/TLS Certificate Management API — Orders business capability. Self-contained, no shared references.
    resources:
    - name: orders
      path: /orders
      operations:
      - name: listorders
        method: GET
        description: List Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: page
          in: query
          type: integer
    - name: orders-orderId
      path: /orders/{orderId}
      operations:
      - name: getorder
        method: GET
        description: Get Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.SSL_TLS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: certificate-management-orders-rest
    port: 8080
    description: REST adapter for SSL/TLS Certificate Management API — Orders. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/orders
      name: orders
      description: REST surface for orders.
      operations:
      - method: GET
        name: listorders
        description: List Orders
        call: certificate-management-orders.listorders
        with:
          status: rest.status
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orders/{orderid}
      name: orders-orderid
      description: REST surface for orders-orderId.
      operations:
      - method: GET
        name: getorder
        description: Get Order
        call: certificate-management-orders.getorder
        with:
          orderId: rest.orderId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: certificate-management-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for SSL/TLS Certificate Management API — Orders. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-orders
      description: List Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: certificate-management-orders.listorders
      with:
        status: tools.status
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
    - name: get-order
      description: Get Order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: certificate-management-orders.getorder
      with:
        orderId: tools.orderId
      outputParameters:
      - type: object
        mapping: $.
