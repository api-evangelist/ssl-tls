naftiko: "1.0.0-alpha1"

info:
  label: "SSL/TLS Certificate Management API"
  description: "REST API for SSL/TLS certificate lifecycle management including issuance, renewal, revocation, and monitoring."
  tags:
    - SSL/TLS
    - Certificate Management
    - PKI
    - Certificate Authority
    - HTTPS
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      CERT_MANAGER_API_KEY: CERT_MANAGER_API_KEY

capability:
  consumes:
    - type: http
      namespace: ssl-tls-cert-mgmt
      baseUri: https://api.certmanager.example.com/v1
      description: "SSL/TLS Certificate Management API"
      authentication:
        type: apikey
        key: X-API-Key
        value: "{{CERT_MANAGER_API_KEY}}"
        placement: header
      resources:
        - name: certificates
          path: /certificates
          description: "Certificate issuance and management"
          operations:
            - name: list-certificates
              method: GET
              description: "List SSL/TLS certificates"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                - name: domain
                  in: query
                  type: string
                  required: false
                - name: expiringBefore
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: request-certificate
              method: POST
              description: "Request a new certificate"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  domains: "{{tools.domains}}"
                  certType: "{{tools.certType}}"
        - name: certificate-by-id
          path: /certificates/{certificateId}
          description: "Individual certificate management"
          operations:
            - name: get-certificate
              method: GET
              description: "Get certificate details"
              inputParameters:
                - name: certificateId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: certificate-download
          path: /certificates/{certificateId}/download
          description: "Certificate download"
          operations:
            - name: download-certificate
              method: GET
              description: "Download certificate in PEM format"
              inputParameters:
                - name: certificateId
                  in: path
                  type: string
                  required: true
                - name: format
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: certificate-renew
          path: /certificates/{certificateId}/renew
          description: "Certificate renewal"
          operations:
            - name: renew-certificate
              method: POST
              description: "Renew an existing certificate"
              inputParameters:
                - name: certificateId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: certificate-revoke
          path: /certificates/{certificateId}/revoke
          description: "Certificate revocation"
          operations:
            - name: revoke-certificate
              method: POST
              description: "Revoke a certificate"
              inputParameters:
                - name: certificateId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: orders
          path: /orders
          description: "Certificate order management"
          operations:
            - name: list-orders
              method: GET
              description: "List certificate orders"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: order-by-id
          path: /orders/{orderId}
          description: "Order details"
          operations:
            - name: get-order
              method: GET
              description: "Get certificate order details"
              inputParameters:
                - name: orderId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: domains
          path: /domains
          description: "Domain management"
          operations:
            - name: list-domains
              method: GET
              description: "List registered domains"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: monitoring-expiring
          path: /monitoring/expiring
          description: "Certificate expiry monitoring"
          operations:
            - name: get-expiring-certificates
              method: GET
              description: "Get certificates expiring within N days"
              inputParameters:
                - name: days
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: ssl-tls-cert-mgmt-api
      resources:
        - path: /v1/certificates
          name: certificates
          description: "Certificate management"
          operations:
            - method: GET
              name: list-certificates
              description: "List certificates"
            - method: POST
              name: request-certificate
              description: "Request certificate"
        - path: /v1/monitoring/expiring
          name: expiring-certs
          description: "Expiring certificates"
          operations:
            - method: GET
              name: get-expiring-certificates
              description: "Get expiring certificates"

    - type: mcp
      port: 9100
      namespace: ssl-tls-cert-mgmt-mcp
      transport: http
      tools:
        - name: list-certificates
          description: "List SSL/TLS certificates with optional status and domain filtering"
          hints:
            readOnly: true
            idempotent: true
          call: "ssl-tls-cert-mgmt.list-certificates"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-certificate
          description: "Get SSL/TLS certificate details by ID"
          hints:
            readOnly: true
            idempotent: true
          call: "ssl-tls-cert-mgmt.get-certificate"
          outputParameters:
            - type: object
              mapping: "$."
        - name: request-certificate
          description: "Request a new SSL/TLS certificate"
          hints:
            readOnly: false
            idempotent: false
          call: "ssl-tls-cert-mgmt.request-certificate"
          outputParameters:
            - type: object
              mapping: "$."
        - name: renew-certificate
          description: "Renew an existing SSL/TLS certificate"
          hints:
            readOnly: false
            idempotent: false
          call: "ssl-tls-cert-mgmt.renew-certificate"
          outputParameters:
            - type: object
              mapping: "$."
        - name: revoke-certificate
          description: "Revoke an SSL/TLS certificate"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "ssl-tls-cert-mgmt.revoke-certificate"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-expiring-certificates
          description: "Get certificates expiring within the next N days"
          hints:
            readOnly: true
            idempotent: true
          call: "ssl-tls-cert-mgmt.get-expiring-certificates"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-domains
          description: "List domains registered in the certificate manager"
          hints:
            readOnly: true
            idempotent: true
          call: "ssl-tls-cert-mgmt.list-domains"
          outputParameters:
            - type: object
              mapping: "$."
