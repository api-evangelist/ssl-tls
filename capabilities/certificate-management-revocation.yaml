naftiko: 1.0.0-alpha2
info:
  label: SSL/TLS Certificate Management API — Revocation
  description: 'SSL/TLS Certificate Management API — Revocation. 1 operations. Lead operation: Revoke Certificate. Self-contained
    Naftiko capability covering one Ssl Tls business surface.'
  tags:
  - Ssl Tls
  - Revocation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SSL_TLS_API_KEY: SSL_TLS_API_KEY
capability:
  consumes:
  - type: http
    namespace: certificate-management-revocation
    baseUri: https://api.certmanager.example.com/v1
    description: SSL/TLS Certificate Management API — Revocation business capability. Self-contained, no shared references.
    resources:
    - name: certificates-certificateId-revoke
      path: /certificates/{certificateId}/revoke
      operations:
      - name: revokecertificate
        method: POST
        description: Revoke Certificate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.SSL_TLS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: certificate-management-revocation-rest
    port: 8080
    description: REST adapter for SSL/TLS Certificate Management API — Revocation. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/certificates/{certificateid}/revoke
      name: certificates-certificateid-revoke
      description: REST surface for certificates-certificateId-revoke.
      operations:
      - method: POST
        name: revokecertificate
        description: Revoke Certificate
        call: certificate-management-revocation.revokecertificate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: certificate-management-revocation-mcp
    port: 9090
    transport: http
    description: MCP adapter for SSL/TLS Certificate Management API — Revocation. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: revoke-certificate
      description: Revoke Certificate
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: certificate-management-revocation.revokecertificate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
