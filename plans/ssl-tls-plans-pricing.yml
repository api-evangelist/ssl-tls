specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: SSL/TLS
providerId: ssl-tls
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - SSL/TLS
  - TLS
  - Certificates
  - PKI
  - Certificate Authority
description: SSL/TLS is a category index covering certificate-authority APIs from multiple vendors (Let's Encrypt ACME, DigiCert, Sectigo). There is no single pricing surface. Let's Encrypt is free for DV certificates; DigiCert and Sectigo price per certificate per validation level (DV, OV, EV) and ship their pricing through sales contracts. Treat this artifact as a Contact Sales placeholder; per-vendor plans should live in vendor-specific provider repos.
sources:
  - https://letsencrypt.org/
  - https://www.digicert.com/tls-ssl/tls-ssl-certificates
  - https://www.sectigo.com/ssl-certificates-tls
notes: Multi-vendor category index. Pricing is per-vendor and not unifiable; consult each CA for specific certificate-class pricing.
plans:
  - id: ssl-tls-contact-sales
    name: Contact Sales
    type: enterprise
    description: Per-vendor commercial pricing applies. Let's Encrypt issues DV certificates at no cost; DigiCert and Sectigo price per certificate, validation level, and term length under direct or reseller contracts.
    entries:
      - label: Per-Certificate Pricing
        name: certificate
        type: flat
        metric: certificate
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Let's Encrypt - Free DV Certificates
      - name: DigiCert - DV / OV / EV Certificates (Contact Sales)
      - name: Sectigo - DV / OV / EV Certificates (Contact Sales)
maintainers:
  - name: API Evangelist
    url: https://apievangelist.com
